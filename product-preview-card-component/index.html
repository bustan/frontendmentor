<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link href="./output.css" rel="stylesheet">
  
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body class="m-0 min-h-screen place-items-center grid bg-[#f2ebe3] p-4">
  <main class="w-full max-w-[37.5rem] bg-white overflow-hidden md:grid md:grid-cols-2 rounded-lg">
    <img class="h-64 md:h-full w-full object-cover" src="./images/image-product-desktop.jpg" alt="Product Image">
    <section class="p-6">
      <p class="mb-5 font-[Montserrat] tracking-[0.35rem] text-[#6c7289]">PERFUME</p>
      <p class="mb-6 text-4xl font-[Fraunces]">Gabrielle Essence Eau De Parfum</p>
      <p class="mb-6 font-[Montserrat] text-sm text-[#6c7289]">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfume-Creator for the House of CHANEL.</p>
      <div class="mb-6 flex flex-row items-center gap-4">
        <p class="leading-none font-[Fraunces] text-[2rem] text-[#3d8168]">$149.99</p>
        <p class="m-0 line-through text-[1rem] text-[#6c7289]">$169.99</p>
      </div>
    <button class="rounded-lg flex w-full bg-[#3d8168] items-center justify-center text-white text-[0.875rem] font-bold px-4 py-4 gap-3 font-[Montserrat]" type="button">
      <img src="./images/icon-cart.svg" alt="Cart Icon">
       Add to Cart
    </button>
    </section>
  </main>

</body>
</html>
